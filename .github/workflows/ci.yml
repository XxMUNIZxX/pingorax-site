name: CI

# Roda em todo PR e em todo push na main: testes e build. Se algo quebrar, o PR mostra ❌ antes do merge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Testes
        shell: bash
        run: |
          set +e
          bun run test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            # Mostra nas anotações do PR quais testes falharam (o log completo nem sempre dá para baixar).
            msg=$(sed "s/\x1b\[[0-9;]*m//g" test.log | grep -A12 -E "FAIL|Transform failed" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Testes falharam::${msg}"
          fi
          exit $code
      - name: Build
        run: bun run build
        env:
          # O build só precisa de valores de exemplo; nada daqui é segredo.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: public-anon-key-for-build
      - name: Tipos (aviso, não bloqueia)
        run: bun run typecheck
        continue-on-error: true
