name: App do caller (Windows)

# Em PR que mexe em desktop/: confere testes e monta o instalador (sem publicar).
# Ao criar uma tag "v1.2.3": monta o instalador e publica na página de Releases; o app instalado se atualiza sozinho a partir dela.
on:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versão (a partir da tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Instalar
        run: npm install --no-audit --no-fund
      - name: Testes
        run: npm test
      - name: Tipos (aviso, não bloqueia)
        run: npm run typecheck
        continue-on-error: true
      - name: Montar instalador
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist
      - name: Montar e publicar
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Guardar instalador do PR
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: PingoraX-Logger-instalador
          path: desktop/release/*.exe
          if-no-files-found: warn
